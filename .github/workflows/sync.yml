name: Sync Kitab Audio
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vfmaudio-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh the validated Cloudflare catalog
        env:
          VFMAUDIO_SYNC_TOKEN: ${{ secrets.VFMAUDIO_SYNC_TOKEN }}
        run: |
          if [ -z "$VFMAUDIO_SYNC_TOKEN" ]; then
            echo 'VFMAUDIO_SYNC_TOKEN is not configured.' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $VFMAUDIO_SYNC_TOKEN" \
            https://vfmaudio.rezaprama.workers.dev/api/admin/sync
      - name: Record one successful source check per month
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/record-sync.py
          git add .github/sync-heartbeat.json
          if git diff --cached --quiet; then
            echo 'This month already has a successful source-check record.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: record monthly source check'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
